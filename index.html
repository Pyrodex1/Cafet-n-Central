<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafetín Central UCV - Acceso</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>Cafetín Central UCV</h1>
            <p class="subtitle">Sistema de Gestión Digital</p>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                
                <div id="errorMessage" class="error-message"></div>
                
                <button type="submit" class="btn-login">Ingresar</button>
            </form>
            
            <div class="demo-credentials">
                <p><strong>Cuentas de prueba:</strong></p>
                <ul>
                    <li>Cliente: <code>ClienteUCV</code></li>
                    <li>Cajero: <code>caja_01</code></li>
                    <li>Admin: <code>adminRoot</code></li>
                </ul>
            </div>
        </div>
    </div>
    
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
