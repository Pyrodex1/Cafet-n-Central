<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Administración - Cafetín Central</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <header class="admin-header">
        <div class="user-info">
            <h1>Panel de Administración</h1>
            <p id="adminName">Administrador</p>
            <small id="adminRole">Rol: Admin</small>
        </div>
        <button id="logoutBtn" class="btn-logout">Cerrar sesión</button>
    </header>

    <main class="admin-layout">
        <section class="add-product-section">
            <h2>Agregar Nuevo Producto</h2>
            
            <form id="addProductForm" class="product-form">
                <div class="form-group">
                    <label for="productName">Nombre del producto:</label>
                    <input type="text" id="productName" required>
                </div>
                
                <div class="form-group">
                    <label for="productPrice">Precio ($):</label>
                    <input type="number" id="productPrice" step="0.01" min="0" required>
                </div>
                
                <div class="form-group">
                    <label for="productCategory">Categoría:</label>
                    <select id="productCategory" required>
                        <option value="bebidas">Bebidas</option>
                        <option value="comida">Comida</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="productImage">URL de imagen:</label>
                    <input type="url" id="productImage" placeholder="https://..." required>
                </div>
                
                <button type="submit" class="btn-primary">Agregar Producto</button>
            </form>
        </section>

        <section class="manage-section">
            <h2>Gestión de Productos</h2>
            <div id="productList" class="product-list"></div>
        </section>
    </main>

    <script src="js/data.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
